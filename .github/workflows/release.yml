name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package, for example v0.1.9
        required: true
        type: string
      adhoc_preview:
        description: Build an unsigned preview (no Developer ID, no notarization)
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Build and publish macOS app
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate tag and app version
        id: metadata
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$REQUESTED_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/$tag^{commit}" >/dev/null

          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [[ "v$version" != "$tag" ]]; then
            echo "Tag $tag does not match app version $version" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "archive=Index-$tag-macOS.zip" >> "$GITHUB_OUTPUT"

      - name: Run project checks
        run: ./scripts/check.sh

      - name: Import Developer ID certificate
        if: ${{ inputs.adhoc_preview != true }}
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$CERTIFICATE_P12_BASE64" || -z "$CERTIFICATE_PASSWORD" ]]; then
            echo "Missing Developer ID certificate secrets" >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/index-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/index-developer-id.p12"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          rm -f "$certificate"
          echo "INDEX_RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build, notarize, and staple app
        if: ${{ inputs.adhoc_preview != true }}
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_APP_SPECIFIC_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          if [[ -z "$NOTARY_APPLE_ID" || -z "$NOTARY_PASSWORD" || -z "$NOTARY_TEAM_ID" ]]; then
            echo "Missing Apple notarization secrets" >&2
            exit 1
          fi
          ./build.sh release
          built_app="build/Index.app"
          if [[ ! -d "$built_app" ]]; then
            echo "Release App was not produced" >&2
            exit 1
          fi
          codesign --verify --deep --strict "$built_app"

          notary_archive="$RUNNER_TEMP/Index-notary.zip"
          ditto -c -k --sequesterRsrc --keepParent "$built_app" "$notary_archive"
          xcrun notarytool submit "$notary_archive" \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID" \
            --wait
          xcrun stapler staple "$built_app"
          xcrun stapler validate "$built_app"
          spctl --assess --type execute --verbose=2 "$built_app"

          archive="${{ steps.metadata.outputs.archive }}"
          package_root="$(mktemp -d)"
          ditto "$built_app" "$package_root/Index.app"
          codesign --verify --deep --strict "$package_root/Index.app"
          ditto -c -k --sequesterRsrc --keepParent "$package_root/Index.app" "$archive"
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Build unsigned preview
        if: ${{ inputs.adhoc_preview == true }}
        run: |
          INDEX_ALLOW_ADHOC=1 ./build.sh release
          built_app="build/Index.app"
          if [[ ! -d "$built_app" ]]; then
            echo "Release App was not produced" >&2
            exit 1
          fi
          archive="${{ steps.metadata.outputs.archive }}"
          package_root="$(mktemp -d)"
          ditto "$built_app" "$package_root/Index.app"
          ditto -c -k --sequesterRsrc --keepParent "$package_root/Index.app" "$archive"
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Remove signing keychain
        if: always()
        run: |
          if [[ -n "${INDEX_RELEASE_KEYCHAIN:-}" ]]; then
            security delete-keychain "$INDEX_RELEASE_KEYCHAIN" || true
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          ARCHIVE: ${{ steps.metadata.outputs.archive }}
          PREVIEW: ${{ inputs.adhoc_preview }}
        run: |
          if [[ "$PREVIEW" == "true" ]]; then
            cat > release-notes.md <<EOF
          ## Index $RELEASE_TAG（未签名预览）

          此附件由 GitHub Actions 构建，**未使用 Developer ID 签名、未公证**。
          适合体验，不代表正式发行。首次打开时可能需要在「系统设置 → 隐私与安全性」
          中允许运行。

          下载 $ARCHIVE，解压后运行其中的 Index.app。
          EOF
          else
            cat > release-notes.md <<EOF
          ## Index $RELEASE_TAG

          此附件由 GitHub Actions 从版本标签自动构建。

          此附件已使用 Developer ID 签名、公证并 stapled，可直接移动到“应用程序”运行。

          下载 $ARCHIVE，解压后运行其中的 Index.app。
          EOF
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$PREVIEW" == "true" ]]; then
              gh release edit "$RELEASE_TAG" --prerelease \
                --title "Index $RELEASE_TAG" --notes-file release-notes.md
            else
              # 从预览升级为正式签名包时，必须显式取消 prerelease
              gh release edit "$RELEASE_TAG" --prerelease=false \
                --title "Index $RELEASE_TAG" --notes-file release-notes.md
            fi
          else
            if [[ "$PREVIEW" == "true" ]]; then
              gh release create "$RELEASE_TAG" --verify-tag --prerelease \
                --title "Index $RELEASE_TAG" --notes-file release-notes.md
            else
              gh release create "$RELEASE_TAG" --verify-tag \
                --title "Index $RELEASE_TAG" --notes-file release-notes.md
            fi
          fi

          gh release upload "$RELEASE_TAG" \
            "$ARCHIVE" \
            "$ARCHIVE.sha256" \
            --clobber
